<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Parchment background -->
  <rect x="6" y="4" width="52" height="56" rx="6" fill="#F5F0E8" stroke="#5C5040" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 2"/>
  <!-- Title line -->
  <line x1="14" y1="18" x2="50" y2="18" stroke="#8A7E6C" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Body lines -->
  <line x1="14" y1="28" x2="42" y2="28" stroke="#8A7E6C" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="14" y1="35" x2="36" y2="35" stroke="#8A7E6C" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="14" y1="42" x2="30" y2="42" stroke="#8A7E6C" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Star badge -->
  <circle cx="46" cy="12" r="9" fill="#C9A84C" opacity="0.85"/>
  <text x="46" y="16" text-anchor="middle" font-size="12" fill="#2C2418" font-family="sans-serif">★</text>
  <!-- Pencil -->
  <g transform="translate(32, 44) rotate(-30)">
    <rect x="-2" y="-14" width="4" height="18" rx="1" fill="#B85C38" opacity="0.9"/>
    <polygon points="-2,4 2,4 0,9" fill="#C9A84C"/>
    <rect x="-2" y="-14" width="4" height="3" rx="0.5" fill="#EDE5D4"/>
  </g>
</svg>
