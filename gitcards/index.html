<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitCards · AI 插画卡片</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" width="28" height="28">
          <rect x="2" y="2" width="28" height="28" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M8 10h16M8 16h12M8 22h8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="24" cy="22" r="3" fill="currentColor" opacity="0.3"/>
        </svg>
        <h1>GitCards</h1>
        <span class="tagline">AI 生成的开源项目插画卡片</span>
      </div>
      <div class="header-controls">
        <button id="theme-toggle" class="icon-btn" title="切换主题">
          <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Filters -->
  <section class="filters-bar">
    <div class="filters-inner">
      <div class="search-box">
        <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="text" id="search-input" placeholder="搜索项目名称…" autocomplete="off">
      </div>
      <div class="language-filters" id="language-filters">
        <button class="lang-btn active" data-lang="all">全部</button>
      </div>
      <div class="card-count" id="card-count"></div>
    </div>
  </section>

  <!-- Gallery -->
  <main class="gallery" id="gallery">
    <div class="loading-state" id="loading">
      <div class="spinner"></div>
      <p>正在加载卡片…</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p>由 AI 为每个 GitHub 热门项目生成独特的插画卡片</p>
      <p class="footer-sub">GitCards · 用艺术的方式发现开源 · <a href="https://github.com/DannyDaiSun" target="_blank">@DannyDaiSun</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
